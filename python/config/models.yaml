# Forecast models and the image layers exported from each.
#
# Model and layer IDs appear in map URLs (/map/<model>/<layer>), storage keys and annotation
# image sources, so renaming one breaks links. Names are for display only and can change freely.
#
# variables     What layers show, in the order the map lists them. A layer's id is a variable's id and it
#               takes the variable's name, so layers with the same id are one choice on the map, with a
#               model to pick among the models that have it. `group` is the heading it's listed under.
# default_model The model the map opens on, and switches to when the viewer's model lacks a variable
#               (unless the viewer has picked a default model of their own in settings).
#
# Model fields:
#   source       Where frames come from: {kind: uw_wrf} for UW WRF images placed with the annotations, or
#                {kind: dynamical, dataset: <catalog id>} for a dataset from https://dynamical.org/catalog/.
#   region       dynamical only: [west, south, east, north] in degrees, the area to render.
#   attribution  Credit shown with the model's frames (CC BY datasets require it).
#
# UW WRF layer fields:
#   url      Image URL for one forecast hour. Fields: {init} is the run's initialization time
#            (a datetime, so use a strftime format such as {init:%Y%m%d%H}); {hour} is the forecast hour.
#   hours    Forecast hours published: first (default 0) to last, every step (default 3) hours.
#   maptype  Georegistration annotations to place the image with (a maptype in the annotation document).
#
# dynamical.org layer fields:
#   field    The dataset variable shown (a name), or {derive: ..., variables: [...], hours: N}:
#              wind_speed      speed from [u, v] components
#              change          growth of a run total over the last N hours (e.g. 3-hour precipitation)
#              rate_sum        a rate averaged since the previous step, summed over the last N hours
#              freezing_level  a height, with missing, zero or negative values (at or below sea level) as 0
#   scale    Color scale and display units (upslope/models/dynamical/scales.py), e.g. temperature_f, precip_in.
#   hours    As for UW WRF; each hour must be a lead time of the dataset.
# `upslope check-layers -m <model>` checks variables, hours and units against the live dataset.
#
# UW WRF images: https://a.atmos.washington.edu/wrfrt/data/<YYYYMMDDHH>/images_<domain>/<map prefix><variable>.<HH>.0000.gif
#   domains: d1 36km, d2 12km, d3 4km, d4 1.33km
#   map prefixes: "" for the domain's full map, wa_ washington, ww_ western-washington
#   3-hour accumulations (pcp3, snow3, msnow3) have an empty hour 0 and no hour 3, so they start at 6.
#   Each domain frames its maps differently, so each (domain, map) pair needs its own maptype:
#     d3: "" pacific-northwest, wa_ washington
#     d4: "" pacific-northwest-hr, ww_ western-washington. d4 runs to hour 72, and intcld, olr, fzlt
#         and fzlc exist only on its full map.

default_model: uwwrf_4km

variables:
  - {id: surface-temp, name: Surface temperature, group: Temperature}
  - {id: 10m-wind-speed, name: 10m wind speed, group: Wind}
  - {id: 3-hour-precip, name: 3-hour precipitation, group: Precipitation}
  - {id: 6-hour-precip, name: 6-hour precipitation, group: Precipitation}
  - {id: reflectivity, name: Composite reflectivity, group: Precipitation}
  - {id: snow, name: 3-hour snowfall, group: Snow}
  - {id: model-snow, name: 3-hour model snowfall, group: Snow}
  - {id: accumulated-snowfall, name: Accumulated snowfall, group: Snow}
  - {id: snow-depth, name: Snow depth, group: Snow}
  - {id: swe, name: Snow water equivalent, group: Snow}
  - {id: 6-hour-swe, name: Snow water equivalent (6 hour), group: Snow}
  - {id: freezing-level, name: Freezing level, group: Freezing level}
  - {id: cloud-cover, name: Cloud cover, group: Clouds}
  - {id: integrated-cloud, name: Integrated cloud, group: Clouds}
  - {id: longwave, name: Outgoing longwave radiation, group: Clouds}

models:
  - id: uwwrf_4km
    name: UW WRF 4km
    source: {kind: uw_wrf}
    start_times: [0, 12]
    retention_days: 7
    layers:
      - id: surface-temp
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/wa_tsfc.{hour:02d}.0000.gif
        hours: {last: 120}
        maptype: washington

      - id: 10m-wind-speed
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/wa_wssfc.{hour:02d}.0000.gif
        hours: {last: 120}
        maptype: washington

      - id: integrated-cloud
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/intcld.{hour:02d}.0000.gif
        hours: {last: 120}
        maptype: pacific-northwest

      - id: longwave
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/olr.{hour:02d}.0000.gif
        hours: {last: 120}
        maptype: pacific-northwest

      - id: 3-hour-precip
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/wa_pcp3.{hour:02d}.0000.gif
        hours: {first: 6, last: 120}
        maptype: washington

      - id: snow
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/wa_snow3.{hour:02d}.0000.gif
        hours: {first: 6, last: 120}
        maptype: washington

      - id: model-snow
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/msnow3.{hour:02d}.0000.gif
        hours: {first: 6, last: 120}
        maptype: pacific-northwest

      - id: accumulated-snowfall
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/snowacc.{hour:02d}.0000.gif
        hours: {last: 120}
        maptype: pacific-northwest

      - id: freezing-level
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/fzlc.{hour:02d}.0000.gif
        hours: {last: 120}
        maptype: pacific-northwest

      - id: snow-depth
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d3/snodep.{hour:02d}.0000.gif
        hours: {last: 120}
        maptype: pacific-northwest

  - id: uwwrf_1.33km
    name: UW WRF 1.33km
    source: {kind: uw_wrf}
    start_times: [0, 12]
    retention_days: 7
    layers:
      - id: surface-temp
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/ww_tsfc.{hour:02d}.0000.gif
        hours: {last: 72}
        maptype: western-washington

      - id: 10m-wind-speed
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/ww_wssfc.{hour:02d}.0000.gif
        hours: {last: 72}
        maptype: western-washington

      - id: integrated-cloud
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/intcld.{hour:02d}.0000.gif
        hours: {last: 72}
        maptype: pacific-northwest-hr

      - id: longwave
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/olr.{hour:02d}.0000.gif
        hours: {last: 72}
        maptype: pacific-northwest-hr

      - id: 3-hour-precip
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/ww_pcp3.{hour:02d}.0000.gif
        hours: {first: 6, last: 72}
        maptype: western-washington

      - id: snow
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/ww_snow3.{hour:02d}.0000.gif
        hours: {first: 6, last: 72}
        maptype: western-washington

      - id: model-snow
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/ww_msnow3.{hour:02d}.0000.gif
        hours: {first: 6, last: 72}
        maptype: western-washington

      - id: accumulated-snowfall
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/ww_snowacc.{hour:02d}.0000.gif
        hours: {last: 72}
        maptype: western-washington

      - id: freezing-level
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/fzlc.{hour:02d}.0000.gif
        hours: {last: 72}
        maptype: pacific-northwest-hr

      - id: snow-depth
        url: https://a.atmos.washington.edu/wrfrt/data/{init:%Y%m%d%H}/images_d4/ww_snodep.{hour:02d}.0000.gif
        hours: {last: 72}
        maptype: western-washington

  - id: gfs_0.25
    name: GFS 0.25°
    source: {kind: dynamical, dataset: noaa-gfs-forecast-virtual}
    region: [-127, 41.5, -113, 50]
    attribution: NOAA NWS NCEP GFS data processed by dynamical.org from NOAA Open Data Dissemination archives (CC BY 4.0).
    start_times: [0, 6, 12, 18]
    retention_days: 3
    layers:
      - id: surface-temp
        field: temperature_2m
        scale: temperature_f
        hours: {last: 240}

      - id: 10m-wind-speed
        field: {derive: wind_speed, variables: [wind_u_10m, wind_v_10m]}
        scale: wind_mph
        hours: {last: 240}

      - id: 3-hour-precip
        field: {derive: change, variables: [total_precipitation_run_total_surface], hours: 3}
        scale: precip_in
        hours: {first: 3, last: 240}

      - id: snow-depth
        field: snow_thickness_surface
        scale: snow_in
        hours: {last: 240}

      - id: freezing-level
        field: {derive: freezing_level, variables: [geopotential_height_0c_isotherm]}
        scale: height_ft
        hours: {last: 240}

      - id: cloud-cover
        field: total_cloud_cover_atmosphere
        scale: cloud_pct
        hours: {last: 240}

      - id: reflectivity
        field: composite_reflectivity
        scale: reflectivity_dbz
        hours: {last: 240}

  - id: hrrr_3km
    name: HRRR 3km
    source: {kind: dynamical, dataset: noaa-hrrr-forecast-48-hour-virtual}
    region: [-127, 41.5, -113, 50]
    attribution: NOAA NWS NCEP HRRR data processed by dynamical.org from NOAA Open Data Dissemination archives (CC BY 4.0).
    start_times: [0, 6, 12, 18]
    retention_days: 2
    layers:
      - id: surface-temp
        field: temperature_2m
        scale: temperature_f
        hours: {last: 48, step: 1}

      - id: 10m-wind-speed
        # grid-relative components; their speed is the same as earth-relative
        field: {derive: wind_speed, variables: [wind_u_10m, wind_v_10m]}
        scale: wind_mph
        hours: {last: 48, step: 1}

      - id: 3-hour-precip
        field: {derive: change, variables: [total_precipitation_run_total_surface], hours: 3}
        scale: precip_in
        hours: {first: 3, last: 48, step: 1}

      - id: snow
        field: {derive: change, variables: [total_snowfall_run_total_surface], hours: 3}
        scale: snow_in
        hours: {first: 3, last: 48, step: 1}

      - id: accumulated-snowfall
        field: total_snowfall_run_total_surface
        scale: snow_in
        hours: {last: 48, step: 1}

      - id: snow-depth
        field: snow_thickness_surface
        scale: snow_in
        hours: {last: 48, step: 1}

      - id: freezing-level
        field: {derive: freezing_level, variables: [geopotential_height_0c_isotherm]}
        scale: height_ft
        hours: {last: 48, step: 1}

      - id: cloud-cover
        field: total_cloud_cover_atmosphere
        scale: cloud_pct
        hours: {last: 48, step: 1}

      - id: reflectivity
        field: composite_reflectivity
        scale: reflectivity_dbz
        hours: {last: 48, step: 1}

  - id: rrfs_3km
    name: RRFS 3km
    source: {kind: dynamical, dataset: noaa-rrfs-forecast-84-hour-virtual}
    region: [-127, 41.5, -113, 50]
    attribution: NOAA NWS NCEP RRFS data processed by dynamical.org from NOAA Open Data Dissemination archives (CC BY 4.0).
    start_times: [0, 6, 12, 18]
    retention_days: 2
    layers:
      - id: surface-temp
        field: temperature_2m
        scale: temperature_f
        hours: {last: 84, step: 3}

      - id: 10m-wind-speed
        # grid-relative components; their speed is the same as earth-relative
        field: {derive: wind_speed, variables: [wind_u_10m, wind_v_10m]}
        scale: wind_mph
        hours: {last: 84, step: 3}

      - id: 3-hour-precip
        field: {derive: change, variables: [total_precipitation_run_total_surface], hours: 3}
        scale: precip_in
        hours: {first: 3, last: 84, step: 3}

      - id: snow
        field: {derive: change, variables: [total_snowfall_run_total_surface], hours: 3}
        scale: snow_in
        hours: {first: 3, last: 84, step: 3}

      - id: accumulated-snowfall
        field: total_snowfall_run_total_surface
        scale: snow_in
        hours: {last: 84, step: 3}

      - id: snow-depth
        field: snow_thickness_surface
        scale: snow_in
        hours: {last: 84, step: 3}

      - id: freezing-level
        field: {derive: freezing_level, variables: [geopotential_height_0c_isotherm]}
        scale: height_ft
        hours: {last: 84, step: 3}

      - id: cloud-cover
        field: total_cloud_cover_atmosphere
        scale: cloud_pct
        hours: {last: 84, step: 3}

      - id: reflectivity
        field: composite_reflectivity
        scale: reflectivity_dbz
        hours: {last: 84, step: 3}

  - id: aifs_0.25
    name: ECMWF AIFS 0.25°
    source: {kind: dynamical, dataset: ecmwf-aifs-single-forecast-virtual}
    region: [-127, 41.5, -113, 50]
    attribution: ECMWF AIFS Single forecast data processed by dynamical.org from ECMWF Open Data (CC BY 4.0).
    start_times: [0, 6, 12, 18]
    retention_days: 3
    # AIFS steps are 6-hourly, so accumulations are over 6 hours
    layers:
      - id: surface-temp
        field: temperature_2m
        scale: temperature_f
        hours: {last: 360, step: 6}

      - id: 10m-wind-speed
        field: {derive: wind_speed, variables: [wind_u_10m, wind_v_10m]}
        scale: wind_mph
        hours: {last: 360, step: 6}

      - id: 6-hour-precip
        field: {derive: change, variables: [total_precipitation_run_total_surface], hours: 6}
        scale: precip_in
        hours: {first: 6, last: 360, step: 6}

      - id: 6-hour-snowfall-water
        field: {derive: change, variables: [snowfall_water_equivalent_run_total_surface], hours: 6}
        scale: precip_in
        hours: {first: 6, last: 360, step: 6}

      - id: cloud-cover
        field: total_cloud_cover_atmosphere
        scale: cloud_pct
        hours: {last: 360, step: 6}

  - id: hrdps_2.5km
    name: HRDPS 2.5km
    # a materialized dataset (no virtual one exists): a run appears once it's complete, about 4.5 h after init
    source: {kind: dynamical, dataset: eccc-hrdps-forecast}
    region: [-127, 41.5, -113, 50]
    attribution: >-
      ECCC HRDPS data processed by dynamical.org from Environment and Climate Change Canada, used under the ECCC
      Data Servers End-use Licence version 2.1 (https://eccc-msc.github.io/open-data/licence/readme_en/).
    start_times: [0, 6, 12, 18]
    retention_days: 2
    layers:
      - id: surface-temp
        field: temperature_2m
        scale: temperature_f
        hours: {last: 48, step: 1}

      - id: 10m-wind-speed
        field: wind_speed_10m
        scale: wind_mph
        hours: {last: 48, step: 1}

      - id: 3-hour-precip
        # an average rate since the previous hour, summed over 3 hours
        field: {derive: rate_sum, variables: [precipitation_surface], hours: 3}
        scale: precip_in
        hours: {first: 3, last: 48, step: 1}

      - id: snow-water-equivalent
        field: snow_water_equivalent_surface
        scale: snow_in
        hours: {last: 48, step: 1}

      - id: cloud-cover
        # missing at hour 0
        field: total_cloud_cover_atmosphere
        scale: cloud_pct
        hours: {first: 1, last: 48, step: 1}
