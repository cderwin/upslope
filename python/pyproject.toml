[project]
name = "upslope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "affine>=3.0.1",
    "attrs>=25.4.0",
    "boto3>=1.43.116",
    "botocore>=1.43.116",
    "cattrs>=25.3.0",
    "click>=8.3.0",
    "google-crc32c>=1.9.0",
    "gribberish>=1.9.0",
    "httpx>=0.28.1",
    "icechunk>=2.3.1",
    "litestar[standard]>=2.25.0",
    "numcodecs>=0.17.1",
    "numpy>=2.3.5",
    "omfiles>=1.2.0",
    "pillow>=11.0.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
upslope = "upslope.cli.main:main"

[tool.setuptools]
packages = ["upslope"]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# georegistration filters this for the whole process (UW GIFs are placed by our own transform); pytest resets
# warning filters per test, so mirror it here
filterwarnings = [
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    # the archive consolidates its Zarr v3 metadata on purpose (one request to open a run)
    "ignore:Consolidated metadata is currently not part:UserWarning",
]
