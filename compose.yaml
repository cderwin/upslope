# Local end-to-end stack: MinIO as the S3 backend, seeded with the repo's annotation snapshot
# (dev/georegistration), plus the upslope server and the exporter, which checks every model for new frames
# at startup and then every 15 minutes (as in production, separate processes sharing the bucket).
#   just up      # build and start, then open http://localhost:8000/map
#   just reset   # stop and wipe MinIO's data (the next `up` seeds the snapshot again)
#
# Local-only credentials; nothing here is used in production.

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: upslope
  AWS_SECRET_ACCESS_KEY: upslope-local-secret
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL_S3: http://minio:9000
  # StorageClient uses virtual-host-style addressing (as Tigris requires), so this bucket
  # name must match the `upslope-storage.minio` network alias below.
  BUCKET_NAME: upslope-storage
  # forecasts go in a second, anonymously readable bucket, which the browser reads directly (as on Tigris)
  PUBLIC_BUCKET_NAME: upslope-data-public
  PUBLIC_DATA_URL: http://localhost:9000/upslope-data-public/forecasts

services:
  minio:
    # Community build of MinIO; official MinIO images are no longer published.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: upslope
      MINIO_ROOT_PASSWORD: upslope-local-secret
      # serve <bucket>.minio:9000 as virtual-host-style requests
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - upslope-storage.minio
          - upslope-data-public.minio
    ports:
      - "9000:9000" # the public bucket, which the map reads from (PUBLIC_DATA_URL)
      - "9001:9001" # web console, log in with the root user above
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 upslope upslope-local-secret &&
        mc mb --ignore-existing local/upslope-storage local/upslope-data-public &&
        mc anonymous set download local/upslope-data-public

  # Uploads dev/georegistration as the draft and published annotations; skips if MinIO already has a draft.
  georegistration-seed:
    build: &upslope-build
      context: .
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    image: upslope:local
    command: ["upslope", "georegistration", "upload", "/seed"]
    environment: *s3-env
    volumes:
      - ./dev/georegistration:/seed:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully

  server:
    build: *upslope-build
    image: upslope:local
    command: ["upslope", "serve"]
    environment:
      <<: *s3-env
      # token for /admin and the annotation page; set ADMIN_TOKEN in .env.local to override
      ADMIN_TOKEN: ${ADMIN_TOKEN:-upslope-local-admin}
    depends_on:
      georegistration-seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  exporter:
    build: *upslope-build
    image: upslope:local
    command: ["upslope", "export-loop", "--run-immediately"]
    environment: *s3-env
    # the image's healthcheck is the server's
    healthcheck:
      disable: true
    depends_on:
      georegistration-seed:
        condition: service_completed_successfully

volumes:
  minio-data:
