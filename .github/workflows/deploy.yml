# Deploys to Fly.io on every push to main (i.e. merged PRs), after CI passes.
# Same as `just deploy`. Needs the FLY_API_TOKEN and VITE_MAPBOX_TOKEN repo secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production is a single machine: run deploys one at a time, and never cancel one midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Fly.io
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::Set the FLY_API_TOKEN repo secret (fly tokens create deploy -a upslope)"; exit 1; }
          [ -n "$VITE_MAPBOX_TOKEN" ] || echo "::warning::VITE_MAPBOX_TOKEN is not set; /map will show a missing-token warning"
      # --remote-only builds on Fly's builders; --ha=false keeps exactly one machine,
      # since the server runs the hourly export itself.
      - run: flyctl deploy --remote-only --ha=false --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
