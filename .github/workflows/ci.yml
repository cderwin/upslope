# Backend tests and webapp typecheck (what `just test` runs). Required on PRs, and
# reused by deploy.yml so main only deploys when they pass.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      # Python version comes from python/.python-version; --locked fails if uv.lock is stale.
      - run: uv sync --locked
      - run: uv run pytest

  webapp:
    name: Webapp typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's build stage.
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
