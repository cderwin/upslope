# Fly.io deployment: merging to main deploys via .github/workflows/deploy.yml;
# `just deploy` does the same by hand.
# Storage: `fly storage create` provisions a Tigris bucket and sets the AWS_* and
# BUCKET_NAME secrets that StorageClient reads.

app = "upslope"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # VITE_MAPBOX_TOKEN is passed as --build-arg by deploy.yml and `just deploy`

[http_service]
  internal_port = 8000
  force_https = true
  # The server also runs the hourly export, so keep exactly one machine always running
  # (deploys pass --ha=false so Fly doesn't create a second one).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # georegistering and PNG conversion are memory-hungry
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
