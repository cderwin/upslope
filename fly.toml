# Fly.io deployment: merging to main deploys via .github/workflows/deploy.yml;
# `just deploy` does the same by hand.
# Storage: `fly storage create` provisions a Tigris bucket and sets the AWS_* and
# BUCKET_NAME secrets that StorageClient reads. Forecasts go to a second, public bucket:
# PUBLIC_BUCKET_NAME and PUBLIC_DATA_URL secrets (see README.md).

app = "upslope"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # VITE_MAPBOX_TOKEN is passed as --build-arg by deploy.yml and `just deploy`

# Three process groups, each on its own machine, so exporting and archiving never slow down requests:
# - web serves the API and webapp;
# - exporter checks for and exports new frames every 15 minutes. Exactly one may run (two would race on
#   manifests and retention), so deploys pass --ha=false; Fly keeps a standby that starts only if it fails.
# - archiver archives new model runs (python/config/archive.yaml) every 15 minutes to archive/ in the private
#   bucket. Like the exporter, exactly one may run.
# They share only storage: the exporter writes forecasts/ (including export-status.json, which /fx/status
# reports) to the public bucket (PUBLIC_BUCKET_NAME), which browsers read directly at PUBLIC_DATA_URL.
[processes]
  web = "upslope serve"
  # also checks once at startup, so a deploy that changes the layers publishes them right away
  exporter = "upslope export-loop --run-immediately"
  archiver = "upslope archive-loop --run-immediately"

[http_service]
  processes = ["web"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # the server only reads storage and serves files (~100 MB resident)
  processes = ["web"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  # georegistering, decoding GRIB fields from dynamical.org and PNG conversion are memory-hungry. Several
  # renders run at once (3 dynamical.org, plus UW WRF), and a shared CPU's quota scales with its count, so
  # 4 keeps a busy check from being throttled
  processes = ["exporter"]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 4

[[vm]]
  # archives two models at once, each holding one variable of a run (HRRR: ~30 MB as float32) while decoding
  # full-grid GRIB fields from dynamical.org; Open-Meteo files are downloaded to disk, one at a time
  processes = ["archiver"]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
