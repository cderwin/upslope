# Fly.io deployment: merging to main deploys via .github/workflows/deploy.yml;
# `just deploy` does the same by hand.
# Storage: `fly storage create` provisions a Tigris bucket and sets the AWS_* and
# BUCKET_NAME secrets that StorageClient reads.

app = "upslope"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # VITE_MAPBOX_TOKEN is passed as --build-arg by deploy.yml and `just deploy`

# Two process groups, each on its own machine, so exporting never slows down requests:
# - web serves the API and webapp;
# - exporter checks for and exports new frames every 15 minutes. Exactly one may run (two would race on
#   manifests and retention), so deploys pass --ha=false; Fly keeps a standby that starts only if it fails.
# They share only the bucket: the exporter writes forecasts/export-status.json, which /fx/status reports.
[processes]
  web = "upslope serve"
  # also checks once at startup, so a deploy that changes the layers publishes them right away
  exporter = "upslope export-loop --run-immediately"

[http_service]
  processes = ["web"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # the server only reads storage and serves files (~100 MB resident)
  processes = ["web"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  # georegistering, decoding GRIB fields from dynamical.org and PNG conversion are memory-hungry
  processes = ["exporter"]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
